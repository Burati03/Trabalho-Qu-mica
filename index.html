<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAB pH MASTER Advanced</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>🧪 LAB pH MASTER ADVANCED</h1>
<div class="hud">

<span>🏅 Estrelas: <b id="stars">0</b></span>
<span>🧫 Fase: <b id="phase">1</b></span>

</header>

<div class="game">

<select id="answer"></select>
<button onclick="checkAnswer()">Responder</button>
<button onclick="runExperiment()" id="expBtn" disabled>Realizar Experimento</button>

</div>

<div class="lab">
<div class="beaker">
<div id="liquid"></div>
</div>
</div>
</div>

<h2>🏆 Ranking Local</h2>
<ol id="ranking"></ol>

<script src="script.js"></script>
</body>
