<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LAB QUIMICO | 5 Fases | Pergunta Obrigatoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
    <div class="info-panel">
        <div class="score-board">PONTOS: <span id="scoreValue">0</span></div>
        <div class="collect-board">COLETAS: <span id="collectCount">0</span> / <span id="needCollect">12</span></div>
        <div class="phase-board">FASE: <span id="phaseValue">1</span>/5</div>
        <div class="ph-board">pH: <span id="phIndicator">7</span></div>
        <div class="health-board">VIDA: <span id="healthValue">5</span></div>
        <div class="message-area" id="gameMsg">WASD para mover | Colete frascos | Responda pergunta para avancar</div>
        <button class="reset-btn" id="resetGameBtn">REINICIAR</button>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>
<div class="controls-tip">
    W A S D = mover | Frasco vermelho = acido -pH | Frasco azul = base +pH | Estrela = +2 pontos | Power-Up = pergunta bonus
</div>
<div id="quizFeedback" class="quiz-feedback"></div>
<div id="phaseQuestionModal" class="phase-question-modal">
    <div class="phase-question-content">
        <h2>PERGUNTA DA FASE</h2>
        <p id="phaseQuestionText">Carregando...</p>
        <div id="phaseQuestionOptions"></div>
    </div>
</div>
<script src="game.js"></script>
</body>
</html>
